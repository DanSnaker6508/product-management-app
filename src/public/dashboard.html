<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Productos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app" class="container">

    <h1>Product Management Dashboard</h1>

    <p style="text-align:center;margin-bottom:25px;color:#cbd5e1;">
        Panel principal para la administración,
        consulta y control de productos.
    </p>

    <div class="formulario">

        <input
            type="text"
            v-model="name"
            placeholder="Nombre">

        <input
            type="text"
            v-model="description"
            placeholder="Descripción">

        <input
            type="number"
            v-model="price"
            placeholder="Precio">

        <input
            type="number"
            v-model="stock"
            placeholder="Stock">

        <button @click="crearProducto">
            Agregar Producto
        </button>

    </div>

    <hr>

    <div id="products">

        <div
            v-for="product in products"
            :key="product._id"
            class="card">

            <h3>{{ product.name }}</h3>

            <p>{{ product.description }}</p>

            <p>${{ product.price }}</p>

            <p>Stock: {{ product.stock }}</p>

            <button @click="eliminarProducto(product._id)">
                Eliminar
            </button>

        </div>

    </div>

    <button @click="logout">
        Cerrar Sesión
    </button>

</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="script.js"></script>

</body>
</html>
